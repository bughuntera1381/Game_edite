name: Create and Commit Zip

on:
  push:
    branches: [ main ]

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Zip file
        run: |
          # نام فایل زیپ و مسیر آن را می‌توانید تغییر دهید
          zip -r -q my-project.zip . -x "*.git*"

      - name: Commit and push zip
        uses: EndBug/add-and-commit@v9
        with:
          # فایل زیپ را به لیست تغییرات اضافه می‌کند
          add: 'my-project.zip'
          # پیام کامیت
          message: 'Auto-generate project zip file'
          # پوش کردن تغییرات به مخزن
          push: true
